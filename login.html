<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HopeLink Mahama</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --primary-color: #4f46e5;
            --success-color: #10b981;
            --error-color: #ef4444;
            --warning-color: #f59e0b;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .auth-card:hover {
            transform: translateY(-5px);
        }
        
        .form-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }
        
        .form-input.valid {
            border-color: var(--success-color);
        }
        
        .form-input.invalid {
            border-color: var(--error-color);
        }
        
        .input-group {
            position: relative;
            margin-bottom: 8px;
        }
        
        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
            font-size: 18px;
        }
        
        .input-with-icon {
            padding-left: 52px;
            padding-right: 52px;
        }
        
        .password-toggle {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 18px;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }
        
        .password-toggle:hover {
            color: var(--primary-color);
        }
        
        .error-message {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 20px;
        }
        
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), #7c3aed);
            color: white;
            font-weight: 600;
            padding: 18px 24px;
            border-radius: 12px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
        }
        
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .btn-google {
            background: white;
            color: #374151;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px 24px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
        
        .btn-google:hover {
            background: #f9fafb;
            border-color: #d1d5db;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: #6b7280;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        
        .divider span {
            padding: 0 16px;
            font-size: 14px;
        }
        
        .notification {
            position: fixed;
            top: 100px;
            right: 24px;
            padding: 20px 24px;
            border-radius: 12px;
            color: white;
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            min-width: 300px;
        }
        
        .notification.show {
            transform: translateX(0);
        }
        
        .notification.success {
            background: linear-gradient(135deg, var(--success-color), #059669);
        }
        
        .notification.error {
            background: linear-gradient(135deg, var(--error-color), #dc2626);
        }
        
        .notification.info {
            background: linear-gradient(135deg, var(--primary-color), #2563eb);
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 20px;
        }
        
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            transform: translateY(20px) scale(0.95);
            transition: all 0.3s ease;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        
        .modal-overlay.show .modal-content {
            transform: translateY(0) scale(1);
        }
        
        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            justify-content: center;
        }
        
        .logo-icon {
            background: linear-gradient(135deg, var(--primary-color), #7c3aed);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-text h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin: 0;
            line-height: 1.2;
        }
        
        .logo-text p {
            font-size: 14px;
            color: var(--success-color);
            font-weight: 600;
            margin: 0;
            letter-spacing: 0.5px;
        }
        
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 24px 0 32px;
        }
        
        .remember-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #4b5563;
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            border-radius: 6px;
            border: 2px solid #d1d5db;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        
        .checkbox.checked {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .checkbox.checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .forgot-link {
            color: var(--primary-color);
            font-weight: 500;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        
        .forgot-link:hover {
            color: #4338ca;
            text-decoration: underline;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 32px;
            color: #6b7280;
            font-size: 14px;
            padding-top: 24px;
            border-top: 1px solid #f3f4f6;
        }
        
        .signup-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
            margin-left: 4px;
        }
        
        .signup-link a:hover {
            color: #4338ca;
            text-decoration: underline;
        }
        
        @media (max-width: 640px) {
            .auth-container {
                padding: 16px;
            }
            
            .auth-card {
                border-radius: 20px;
            }
            
            .modal-content {
                padding: 24px;
                margin: 16px;
            }
            
            .logo-text h1 {
                font-size: 24px;
            }
        }
        
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card fade-in">
            <div class="p-8">
                <!-- Logo -->
                <div class="logo-container">
                    <div class="logo-icon">
                        <i class="fas fa-hands-helping text-white text-2xl"></i>
                    </div>
                    <div class="logo-text">
                        <h1>HopeLink</h1>
                        <p>Mahama Refugee Camp</p>
                    </div>
                </div>

                <!-- Welcome Message -->
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back</h2>
                    <p class="text-gray-600">Sign in to your HopeLink account</p>
                </div>

                <!-- Google Login -->
                <button onclick="handleGoogleLogin()" class="btn-google mb-6">
                    <i class="fab fa-google text-red-500 text-lg"></i>
                    <span>Continue with Google</span>
                </button>

                <!-- Divider -->
                <div class="divider">
                    <span>Or continue with email</span>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="space-y-6">
                    <!-- Email Field -->
                    <div>
                        <label class="block text-gray-700 font-medium mb-2 text-sm">Email Address</label>
                        <div class="input-group">
                            <i class="input-icon fas fa-envelope"></i>
                            <input type="email" 
                                   id="loginEmail" 
                                   class="form-input input-with-icon"
                                   placeholder="Enter your email"
                                   autocomplete="email"
                                   required>
                        </div>
                        <div id="emailError" class="error-message"></div>
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label class="block text-gray-700 font-medium mb-2 text-sm">Password</label>
                        <div class="input-group">
                            <i class="input-icon fas fa-lock"></i>
                            <input type="password" 
                                   id="loginPassword" 
                                   class="form-input input-with-icon"
                                   placeholder="Enter your password"
                                   autocomplete="current-password"
                                   required>
                            <button type="button" 
                                    class="password-toggle"
                                    onclick="togglePassword('loginPassword')">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div id="passwordError" class="error-message"></div>
                    </div>

                    <!-- Remember & Forgot -->
                    <div class="remember-forgot">
                        <label class="remember-label">
                            <div id="rememberCheckbox" class="checkbox" onclick="toggleRemember()"></div>
                            <span>Remember me</span>
                        </label>
                        <button type="button" 
                                onclick="openForgotPasswordModal()" 
                                class="forgot-link">
                            Forgot password?
                        </button>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                            id="loginButton"
                            class="btn-primary">
                        <span id="loginButtonText">Sign In</span>
                        <span id="loginSpinner" class="loading-spinner hidden"></span>
                    </button>
                </form>

                <!-- Sign Up Link -->
                <div class="signup-link">
                    Don't have an account? 
                    <a href="signup.html">Sign up here</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900">Reset Password</h3>
                <button onclick="closeForgotPasswordModal()" 
                        class="text-gray-500 hover:text-gray-700 text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <p class="text-gray-600 mb-8">Enter your email address and we'll send you a secure link to reset your password.</p>
            
            <form id="forgotPasswordForm" class="space-y-6">
                <div>
                    <label class="block text-gray-700 font-medium mb-2 text-sm">Email Address</label>
                    <div class="input-group">
                        <i class="input-icon fas fa-envelope"></i>
                        <input type="email" 
                               id="forgotEmail"
                               class="form-input input-with-icon"
                               placeholder="Enter your email"
                               autocomplete="email"
                               required>
                    </div>
                    <div id="forgotEmailError" class="error-message"></div>
                </div>
                
                <div class="flex gap-3">
                    <button type="submit" 
                            id="resetButton"
                            class="btn-primary flex-1">
                        <span id="resetButtonText">Send Reset Link</span>
                        <span id="resetSpinner" class="loading-spinner hidden"></span>
                    </button>
                    <button type="button" 
                            onclick="closeForgotPasswordModal()"
                            class="flex-1 bg-gray-100 text-gray-700 font-semibold py-4 rounded-lg hover:bg-gray-200 transition text-sm">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Notification -->
    <div id="notification" class="notification">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i id="notificationIcon"></i>
                <div>
                    <div id="notificationTitle" class="font-semibold text-sm"></div>
                    <div id="notificationMessage" class="text-xs opacity-90"></div>
                </div>
            </div>
            <button onclick="hideNotification()" 
                    class="ml-4 opacity-70 hover:opacity-100">
                <i class="fas fa-times text-sm"></i>
            </button>
        </div>
    </div>

    <!-- Firebase Configuration -->
    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-analytics.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithPopup,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA6srTpyl7YXpr4t3Xij0Lx7DqmHsbaCPs",
            authDomain: "hopelink-mahama-d9cd4.firebaseapp.com",
            projectId: "hopelink-mahama-d9cd4",
            storageBucket: "hopelink-mahama-d9cd4.firebasestorage.app",
            messagingSenderId: "769873156422",
            appId: "1:769873156422:web:5d89b8c5695ce95bb6ad47",
            measurementId: "G-8TQ2LYP809"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // Configure Google Provider
        googleProvider.setCustomParameters({
            prompt: 'select_account'
        });

        // Make Firebase functions globally available
        window.firebaseAuth = auth;
        window.firebaseSignIn = async (email, password) => {
            return await signInWithEmailAndPassword(auth, email, password);
        };

        window.firebaseSendPasswordReset = async (email) => {
            return await sendPasswordResetEmail(auth, email);
        };

        // Google Sign In
        window.signInWithGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, googleProvider);
                const user = result.user;
                
                // Save user data to Firestore if new
                await saveUserToFirestore(user);
                
                return { success: true, user };
            } catch (error) {
                console.error("Google Sign In Error:", error);
                return { success: false, error };
            }
        };

        // Save user to Firestore
        async function saveUserToFirestore(user) {
            try {
                const userRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userRef);
                
                if (!userDoc.exists()) {
                    const userData = {
                        email: user.email,
                        displayName: user.displayName || "",
                        photoURL: user.photoURL || "",
                        provider: 'google',
                        role: "user",
                        accountStatus: "active",
                        profileComplete: false,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString(),
                        lastLogin: new Date().toISOString()
                    };
                    
                    await setDoc(userRef, userData, { merge: true });
                } else {
                    // Update last login
                    await setDoc(userRef, { 
                        lastLogin: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                }
                
                return true;
            } catch (error) {
                console.error("Error saving user data:", error);
                return false;
            }
        }

        // Monitor auth state to redirect logged-in users
        onAuthStateChanged(auth, (user) => {
            if (user && localStorage.getItem('autoRedirect') !== 'false') {
                console.log("User is already logged in, redirecting to main website...");
                localStorage.setItem('user', JSON.stringify({
                    uid: user.uid,
                    email: user.email,
                    displayName: user.displayName,
                    photoURL: user.photoURL
                }));
                
                // Redirect to main website
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            }
        });

        console.log("Firebase Authentication System Initialized");
    </script>

    <!-- Application JavaScript -->
    <script>
        // ============================================================================
        // AUTHENTICATION FUNCTIONS
        // ============================================================================

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.password-toggle i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Toggle remember me checkbox
        function toggleRemember() {
            const checkbox = document.getElementById('rememberCheckbox');
            checkbox.classList.toggle('checked');
        }

        // Show loading state
        function showLoadingState(buttonId, spinnerId, textId, loadingText) {
            const button = document.getElementById(buttonId);
            const spinner = document.getElementById(spinnerId);
            const text = document.getElementById(textId);
            
            button.disabled = true;
            text.textContent = loadingText;
            spinner.classList.remove('hidden');
        }

        // Hide loading state
        function hideLoadingState(buttonId, spinnerId, textId, originalText) {
            const button = document.getElementById(buttonId);
            const spinner = document.getElementById(spinnerId);
            const text = document.getElementById(textId);
            
            button.disabled = false;
            text.textContent = originalText;
            spinner.classList.add('hidden');
        }

        // Show notification
        function showNotification(title, message, type = 'success') {
            const notification = document.getElementById('notification');
            const icon = document.getElementById('notificationIcon');
            const titleEl = document.getElementById('notificationTitle');
            const messageEl = document.getElementById('notificationMessage');
            
            // Set icon based on type
            switch(type) {
                case 'success':
                    icon.className = 'fas fa-check-circle';
                    break;
                case 'error':
                    icon.className = 'fas fa-exclamation-circle';
                    break;
                case 'info':
                    icon.className = 'fas fa-info-circle';
                    break;
            }
            
            titleEl.textContent = title;
            messageEl.textContent = message;
            notification.className = `notification ${type}`;
            notification.classList.add('show');
            
            // Auto hide after 5 seconds
            setTimeout(hideNotification, 5000);
        }

        // Hide notification
        function hideNotification() {
            const notification = document.getElementById('notification');
            notification.classList.remove('show');
        }

        // Validate email
        function validateEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }

        // Validate password
        function validatePassword(password) {
            return password.length >= 6;
        }

        // Show error message
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            if (message) {
                element.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message}`;
                element.style.display = 'flex';
                element.parentElement.querySelector('.form-input').classList.add('invalid');
                element.parentElement.querySelector('.form-input').classList.remove('valid');
            } else {
                element.innerHTML = '';
                element.style.display = 'none';
            }
        }

        // Show success state
        function showSuccess(inputId) {
            const input = document.getElementById(inputId);
            input.classList.add('valid');
            input.classList.remove('invalid');
            const errorId = inputId === 'loginEmail' ? 'emailError' : 
                           inputId === 'loginPassword' ? 'passwordError' : 
                           inputId === 'forgotEmail' ? 'forgotEmailError' : '';
            if (errorId) showError(errorId, '');
        }

        // Handle Google Login
        async function handleGoogleLogin() {
            try {
                if (!window.signInWithGoogle) {
                    showNotification('Service Unavailable', 'Google authentication is currently unavailable. Please use email login.', 'error');
                    return;
                }

                showLoadingState('loginButton', 'loginSpinner', 'loginButtonText', 'Connecting to Google...');
                
                const result = await window.signInWithGoogle();
                
                if (result.success) {
                    const user = result.user;
                    
                    // Store user data
                    localStorage.setItem('user', JSON.stringify({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || user.email.split('@')[0],
                        photoURL: user.photoURL
                    }));
                    
                    showNotification('Login Successful', `Welcome back, ${user.displayName || user.email}!`, 'success');
                    
                    // Redirect to main website after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    throw result.error;
                }
            } catch (error) {
                console.error('Google login error:', error);
                
                let errorMessage = 'Google login failed. Please try again.';
                if (error.code === 'auth/popup-closed-by-user') {
                    errorMessage = 'Login popup was closed. Please try again.';
                } else if (error.code === 'auth/account-exists-with-different-credential') {
                    errorMessage = 'An account already exists with this email. Please sign in with email/password.';
                } else if (error.code === 'auth/popup-blocked') {
                    errorMessage = 'Popup was blocked by your browser. Please allow popups for this site.';
                }
                
                showNotification('Login Failed', errorMessage, 'error');
                hideLoadingState('loginButton', 'loginSpinner', 'loginButtonText', 'Sign In');
            }
        }

        // Handle Login Form Submission
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            // Reset errors
            showError('emailError', '');
            showError('passwordError', '');
            
            // Validate inputs
            let isValid = true;
            
            if (!email) {
                showError('emailError', 'Email is required');
                isValid = false;
            } else if (!validateEmail(email)) {
                showError('emailError', 'Please enter a valid email address');
                isValid = false;
            } else {
                showSuccess('loginEmail');
            }
            
            if (!password) {
                showError('passwordError', 'Password is required');
                isValid = false;
            } else if (!validatePassword(password)) {
                showError('passwordError', 'Password must be at least 6 characters');
                isValid = false;
            } else {
                showSuccess('loginPassword');
            }
            
            if (!isValid) {
                document.getElementById('loginForm').classList.add('shake');
                setTimeout(() => {
                    document.getElementById('loginForm').classList.remove('shake');
                }, 500);
                return;
            }
            
            // Show loading state
            showLoadingState('loginButton', 'loginSpinner', 'loginButtonText', 'Signing In...');
            
            try {
                // Try Firebase authentication
                if (window.firebaseSignIn) {
                    const userCredential = await window.firebaseSignIn(email, password);
                    const user = userCredential.user;
                    
                    // Store user data
                    localStorage.setItem('user', JSON.stringify({
                        uid: user.uid,
                        email: user.email,
                        displayName: user.displayName || email.split('@')[0]
                    }));
                    
                    // Remember email if checked
                    const rememberMe = document.getElementById('rememberCheckbox').classList.contains('checked');
                    if (rememberMe) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }
                    
                    showNotification('Login Successful', `Welcome back, ${user.email}! Redirecting to main website...`, 'success');
                    
                    // Redirect to main website after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    throw new Error('Authentication service unavailable');
                }
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = 'Login failed. Please check your credentials.';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email address.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password. Please try again.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address format.';
                } else if (error.code === 'auth/user-disabled') {
                    errorMessage = 'This account has been disabled.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                }
                
                showNotification('Login Failed', errorMessage, 'error');
                showError('passwordError', errorMessage);
                hideLoadingState('loginButton', 'loginSpinner', 'loginButtonText', 'Sign In');
            }
        }

        // Handle Forgot Password
        async function handleForgotPassword(e) {
            e.preventDefault();
            
            const email = document.getElementById('forgotEmail').value.trim();
            
            // Reset error
            showError('forgotEmailError', '');
            
            // Validate email
            if (!email) {
                showError('forgotEmailError', 'Email is required');
                return;
            }
            
            if (!validateEmail(email)) {
                showError('forgotEmailError', 'Please enter a valid email address');
                return;
            }
            
            showSuccess('forgotEmail');
            
            // Show loading state
            showLoadingState('resetButton', 'resetSpinner', 'resetButtonText', 'Sending...');
            
            try {
                if (window.firebaseSendPasswordReset) {
                    await window.firebaseSendPasswordReset(email);
                    
                    showNotification('Reset Email Sent', 'Check your inbox for password reset instructions.', 'success');
                    
                    // Close modal after success
                    setTimeout(() => {
                        closeForgotPasswordModal();
                    }, 2000);
                } else {
                    throw new Error('Password reset service unavailable');
                }
            } catch (error) {
                console.error('Password reset error:', error);
                
                let errorMessage = 'Failed to send reset email. Please try again.';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email address.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address format.';
                }
                
                showNotification('Reset Failed', errorMessage, 'error');
                showError('forgotEmailError', errorMessage);
            } finally {
                hideLoadingState('resetButton', 'resetSpinner', 'resetButtonText', 'Send Reset Link');
            }
        }

        // Modal Functions
        function openForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.add('show');
            document.getElementById('forgotEmail').focus();
            document.body.style.overflow = 'hidden';
        }

        function closeForgotPasswordModal() {
            document.getElementById('forgotPasswordModal').classList.remove('show');
            document.getElementById('forgotPasswordForm').reset();
            showError('forgotEmailError', '');
            document.body.style.overflow = '';
        }

        // Initialize the page
        function initializePage() {
            // Set up form submissions
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('forgotPasswordForm').addEventListener('submit', handleForgotPassword);
            
            // Load remembered email
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('loginEmail').value = rememberedEmail;
                document.getElementById('rememberCheckbox').classList.add('checked');
                showSuccess('loginEmail');
            }
            
            // Real-time validation
            document.getElementById('loginEmail').addEventListener('input', function() {
                if (validateEmail(this.value)) {
                    showSuccess('loginEmail');
                } else if (this.value) {
                    showError('emailError', 'Please enter a valid email address');
                } else {
                    showError('emailError', '');
                }
            });
            
            document.getElementById('loginPassword').addEventListener('input', function() {
                if (validatePassword(this.value)) {
                    showSuccess('loginPassword');
                } else if (this.value) {
                    showError('passwordError', 'Password must be at least 6 characters');
                } else {
                    showError('passwordError', '');
                }
            });
            
            document.getElementById('forgotEmail').addEventListener('input', function() {
                if (validateEmail(this.value)) {
                    showSuccess('forgotEmail');
                } else if (this.value) {
                    showError('forgotEmailError', 'Please enter a valid email address');
                } else {
                    showError('forgotEmailError', '');
                }
            });
            
            // Close modal on escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeForgotPasswordModal();
                }
            });
            
            // Close modal on outside click
            document.getElementById('forgotPasswordModal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeForgotPasswordModal();
                }
            });
            
            // Prevent auto-redirect for this session
            localStorage.setItem('autoRedirect', 'false');
            
            console.log('Login page initialized');
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', initializePage);
    </script>
</body>
</html>
